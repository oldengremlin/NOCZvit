# Синтетичний конфіг ЛИШЕ для тестів — жодних реальних hostname, credentials чи адрес.
# Названий test-noczvit.properties (а не noczvit.properties), щоб TestFixtures.config()
# завжди міг однозначно знайти саме цей файл через --config=, незалежно від того, чи є
# на диску розробника реальний src/main/resources/noczvit.properties (він є в .gitignore,
# але фізично присутній на робочих машинах — classpath-порядок test-classes/classes тут
# не повинен мати значення).

incidents=true
temperature=true
ramos=false
zabbix=false
debug=false
resilienceaudit=false

mail.hostname=imap.test.invalid
mail.username=test-user
mail.password=test-password
mail.ssl=true
mail.zabbixFolder=INBOX.Zabbix

snmp.community=public
snmp.hosts.suffix=test.invalid

email.from=noc@test.invalid
email.replyTo=noc@test.invalid
email.to=shift@test.invalid
email.toDebug=dev@test.invalid

zabbix.api=https://zabbix.test.invalid/api_jsonrpc.php
zabbix.url=https://zabbix.test.invalid
zabbix.username=test-user
zabbix.password=test-password

snmp.trap.folder=INBOX.Internal.SNMP Traps.DC-Room*
snmp.trap.dedup.seconds=30
snmp.trap.coldstart.link.minutes=5
ramos.trap.folder=INBOX.Internal.SNMP Traps
